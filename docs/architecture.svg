<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#5b636c"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#d5d9d2;stroke-width:1.5}
      .core{fill:#f3f1fb;stroke:#5f3dc4;stroke-width:1.5}
      .q{fill:#fff;stroke:#5f3dc4;stroke-width:1.2;stroke-dasharray:4 3}
      .t{font-size:15px;font-weight:650;fill:#15181c}
      .s{font-size:12.5px;fill:#5b636c}
      .k{font-size:11px;font-weight:700;letter-spacing:1.2px;fill:#5f3dc4}
      .l{stroke:#5b636c;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .both{stroke:#5b636c;stroke-width:1.6;fill:none;marker-end:url(#a);marker-start:url(#a)}
      .lab{font-size:11.5px;fill:#5b636c}
    </style>
  </defs>
  <rect width="1040" height="470" rx="18" fill="#f7f6fa"/>

  <text x="32" y="44" class="k">SENSORS</text>
  <rect class="box" x="32" y="62" width="160" height="70" rx="10"/>
  <text x="48" y="90" class="t">BME280</text>
  <text x="48" y="110" class="s">temp · RH · pressure</text>
  <rect class="box" x="32" y="148" width="160" height="70" rx="10"/>
  <text x="48" y="176" class="t">LM35</text>
  <text x="48" y="196" class="s">10 mV per °C</text>

  <rect class="core" x="232" y="34" width="560" height="372" rx="14"/>
  <text x="250" y="60" class="k">STM32F411 · FREERTOS</text>

  <rect class="box" x="250" y="76" width="180" height="128" rx="10"/>
  <text x="266" y="102" class="t">sensors · prio 4</text>
  <text x="266" y="124" class="s">every 1 s, drift-free</text>
  <text x="266" y="143" class="s">BME280 forced mode</text>
  <text x="266" y="162" class="s">LM35 ×16 average,</text>
  <text x="266" y="181" class="s">VDDA from VREFINT</text>
  <path class="l" d="M192 97 H248"/>
  <text x="200" y="88" class="lab">I2C1</text>
  <path class="l" d="M192 183 H248"/>
  <text x="200" y="174" class="lab">ADC1</text>

  <rect class="q" x="466" y="86" width="104" height="44" rx="8"/>
  <text x="478" y="113" class="s">log queue · 32</text>
  <rect class="q" x="466" y="150" width="104" height="44" rx="8"/>
  <text x="478" y="177" class="s">uplink · 8</text>
  <path class="l" d="M430 108 H464"/>
  <path class="l" d="M430 172 H464"/>

  <rect class="box" x="606" y="76" width="168" height="80" rx="10"/>
  <text x="622" y="102" class="t">logger · prio 2</text>
  <text x="622" y="124" class="s">daily CSV, f_sync</text>
  <text x="622" y="143" class="s">remounts the card</text>
  <path class="l" d="M570 108 H604"/>

  <rect class="box" x="606" y="170" width="168" height="80" rx="10"/>
  <text x="622" y="196" class="t">uplink · prio 3</text>
  <text x="622" y="218" class="s">$LOG out, drops oldest</text>
  <text x="622" y="237" class="s">$TIME / $ACK in</text>
  <path class="l" d="M570 172 C590 172 586 206 604 206"/>

  <rect class="box" x="250" y="232" width="320" height="76" rx="10"/>
  <text x="266" y="258" class="t">supervisor · prio 5</text>
  <text x="266" y="280" class="s">feeds the 4 s IWDG only when every task</text>
  <text x="266" y="298" class="s">has checked in · status LED</text>

  <rect class="box" x="250" y="324" width="250" height="64" rx="10"/>
  <text x="266" y="350" class="t">RTC on LSE</text>
  <text x="266" y="370" class="s">set by $TIME · survives reset</text>
  <path class="l" d="M690 250 V356 H502"/>
  <text x="700" y="310" class="lab">$TIME</text>

  <text x="832" y="44" class="k">OUTPUTS</text>
  <rect class="box" x="832" y="76" width="176" height="80" rx="10"/>
  <text x="848" y="102" class="t">microSD</text>
  <text x="848" y="124" class="s">FatFs over SPI1</text>
  <text x="848" y="143" class="s">LOG/20261029.CSV</text>
  <path class="l" d="M774 116 H830"/>

  <rect class="box" x="832" y="170" width="176" height="80" rx="10"/>
  <text x="848" y="196" class="t">ESP32 bridge</text>
  <text x="848" y="218" class="s">NTP · MQTT publish</text>
  <text x="848" y="237" class="s">→ Telemetry Pipeline</text>
  <path class="both" d="M774 210 H830"/>
  <text x="797" y="232" class="lab">UART</text>

  <text x="32" y="440" class="s">The SD card and the ESP32 each get their own queue, so a slow card or an offline ESP32 never stalls sampling.</text>
</svg>
