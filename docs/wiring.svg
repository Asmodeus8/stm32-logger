<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <style>
      .board{fill:#fff;stroke:#c9cdc5;stroke-width:1.5}
      .t{font-size:16px;font-weight:700;fill:#15181c}
      .s{font-size:12px;fill:#5b636c}
      .pin{font-size:12.5px;font-family:ui-monospace,Consolas,monospace;fill:#15181c}
      .dot{fill:#15181c}
      .w{stroke-width:2.4;fill:none;stroke-linecap:round}
      .k{font-size:11px;font-weight:700;letter-spacing:1.2px;fill:#5f3dc4}
    </style>
  </defs>
  <rect width="1040" height="500" rx="18" fill="#f7f6fa"/>
  <text x="32" y="44" class="k">WIRING · BLACK PILL STM32F411CEU6</text>

  <rect class="board" x="360" y="66" width="230" height="380" rx="12"/>
  <text x="378" y="96" class="t">STM32F411</text>
  <g class="pin">
    <circle class="dot" cx="368" cy="134" r="4"/><text x="380" y="138">PB6  SCL</text>
    <circle class="dot" cx="368" cy="164" r="4"/><text x="380" y="168">PB7  SDA</text>
    <circle class="dot" cx="368" cy="234" r="4"/><text x="380" y="238">PA0  ADC</text>
    <text x="490" y="138">PA5  SCK</text><circle class="dot" cx="582" cy="134" r="4"/>
    <text x="490" y="168">PA6 MISO</text><circle class="dot" cx="582" cy="164" r="4"/>
    <text x="490" y="198">PA7 MOSI</text><circle class="dot" cx="582" cy="194" r="4"/>
    <text x="490" y="228">PA4   CS</text><circle class="dot" cx="582" cy="224" r="4"/>
    <text x="490" y="318">PA9   TX</text><circle class="dot" cx="582" cy="314" r="4"/>
    <text x="490" y="348">PA10  RX</text><circle class="dot" cx="582" cy="344" r="4"/>
    <text x="380" y="398">3V3 · GND to every module</text>
    <text x="380" y="420">PC13 status LED</text>
  </g>

  <rect class="board" x="40" y="100" width="190" height="100" rx="12"/>
  <text x="58" y="128" class="t">BME280</text>
  <text x="58" y="148" class="s">I2C address 0x76 (SDO to GND)</text>
  <g class="pin">
    <text x="150" y="168">SCK</text><circle class="dot" cx="222" cy="164" r="4"/>
    <text x="150" y="188">SDI</text><circle class="dot" cx="222" cy="184" r="4"/>
  </g>
  <path class="w" stroke="#1971c2" d="M222 164 C290 164 300 134 368 134"/>
  <path class="w" stroke="#0c8599" d="M222 184 C300 184 300 164 368 164"/>

  <rect class="board" x="40" y="230" width="190" height="96" rx="12"/>
  <text x="58" y="258" class="t">LM35</text>
  <text x="58" y="278" class="s">0.1 µF across VOUT and GND</text>
  <g class="pin"><text x="150" y="303">VOUT</text><circle class="dot" cx="222" cy="299" r="4"/></g>
  <path class="w" stroke="#e8590c" d="M222 299 C300 299 300 234 368 234"/>

  <rect class="board" x="800" y="96" width="200" height="150" rx="12"/>
  <text x="818" y="124" class="t">microSD module</text>
  <text x="818" y="144" class="s">FAT32 card</text>
  <g class="pin">
    <circle class="dot" cx="808" cy="164" r="4"/><text x="820" y="168">CLK</text>
    <circle class="dot" cx="808" cy="184" r="4"/><text x="820" y="188">DO</text>
    <circle class="dot" cx="808" cy="204" r="4"/><text x="820" y="208">DI</text>
    <circle class="dot" cx="808" cy="224" r="4"/><text x="820" y="228">CS</text>
  </g>
  <path class="w" stroke="#7048e8" d="M582 134 C700 134 700 164 808 164"/>
  <path class="w" stroke="#2f9e44" d="M582 164 C700 164 700 184 808 184"/>
  <path class="w" stroke="#f08c00" d="M582 194 C700 194 700 204 808 204"/>
  <path class="w" stroke="#c2255c" d="M582 224 H808"/>

  <rect class="board" x="800" y="276" width="200" height="110" rx="12"/>
  <text x="818" y="304" class="t">ESP32</text>
  <text x="818" y="324" class="s">115200 8N1</text>
  <g class="pin">
    <circle class="dot" cx="808" cy="344" r="4"/><text x="820" y="348">GPIO16 RX2</text>
    <circle class="dot" cx="808" cy="368" r="4"/><text x="820" y="372">GPIO17 TX2</text>
  </g>
  <path class="w" stroke="#d9480f" d="M582 314 C700 314 700 344 808 344"/>
  <path class="w" stroke="#5c940d" d="M582 344 C700 344 700 368 808 368"/>

  <text x="40" y="476" class="s">TX crosses to RX in both directions. Both boards run at 3.3 V logic, so the UART needs no level shifting.</text>
</svg>
